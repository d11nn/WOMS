apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "woms.fullname" . }}-api
  labels:
    {{- include "woms.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "woms.fullname" . }}-api
      containers:
        - name: api
          image: "{{ include "woms.image" (dict "registry" .Values.imageRegistry "repository" .Values.api.image.repository "tag" .Values.api.image.tag) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-api" (include "woms.fullname" .)) .Values.api.jwtSecretExistingSecret | quote }}
                  key: {{ .Values.api.jwtSecretExistingSecretKey | quote }}
            - name: API_STORE
              value: {{ .Values.api.env.store | quote }}
            - name: DEMO_SEED_DATA
              value: {{ .Values.api.env.demoSeedData | quote }}
            - name: DATABASE_URL
              value: {{ .Values.api.env.databaseUrl | quote }}
            - name: REDIS_ADDR
              value: {{ .Values.api.env.redisAddr | quote }}
            - name: KAFKA_BROKERS
              value: {{ tpl .Values.scheduleQueue.bootstrapServers . | quote }}
            - name: KAFKA_SCHEDULE_TOPIC
              value: {{ .Values.scheduleQueue.topic | quote }}
            - name: KAFKA_CONSUMER_GROUP
              value: {{ .Values.scheduleQueue.consumerGroup | quote }}
            - name: KAFKA_PUBLISH_ENABLED
              value: {{ .Values.api.env.kafkaPublishEnabled | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: HPA_DEMO_HPA_NAME
              value: {{ printf "%s-web-hpa" (include "woms.fullname" .) | quote }}
            - name: HPA_DEMO_DEPLOYMENT_NAME
              value: {{ printf "%s-web" (include "woms.fullname" .) | quote }}
            - name: HPA_DEMO_POD_LABEL_SELECTOR
              value: {{ printf "app.kubernetes.io/instance=%s,app.kubernetes.io/component=web" .Release.Name | quote }}
            - name: CORS_ALLOWED_ORIGIN
              value: {{ .Values.api.env.corsAllowedOrigin | quote }}
            - name: AUTH_MODE
              value: {{ .Values.api.env.authMode | quote }}
            - name: AUTH_SESSION_STORE
              value: {{ .Values.api.env.authSessionStore | quote }}
            - name: API_DEPENDENCY_RETRY_TIMEOUT_MS
              value: {{ .Values.api.env.dependencyRetryTimeoutMs | quote }}
            - name: API_DEPENDENCY_RETRY_INTERVAL_MS
              value: {{ .Values.api.env.dependencyRetryIntervalMs | quote }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
