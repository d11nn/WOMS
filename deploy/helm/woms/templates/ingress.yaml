{{- if .Values.ingress.enabled }}
{{- $routeMode := default "webProxy" .Values.ingress.routeMode }}
{{- if ne $routeMode "webProxy" }}
{{- fail (printf "unsupported ingress.routeMode %q; use webProxy so /api and /grafana stay behind the web container proxy" $routeMode) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "woms.fullname" . }}-public
  labels:
    {{- include "woms.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- tpl (toYaml .) $ | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "woms.fullname" . }}-web
                port:
                  name: http
{{- end }}
