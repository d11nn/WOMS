global:
  imagePullPolicy: IfNotPresent

imageRegistry: docker.io/d11nn

scheduleQueue:
  bootstrapServers: "kafka.{{ .Release.Namespace }}.svc.cluster.local:9092"
  topic: woms.schedule.jobs
  consumerGroup: woms-scheduler-workers

api:
  replicaCount: 2
  pdb:
    minAvailable: 1
  image:
    repository: woms-api
    tag: v0.1.76
  jwtSecret: ""
  jwtSecretExistingSecret: ""
  jwtSecretExistingSecretKey: JWT_SECRET
  env:
    store: postgres
    demoSeedData: "true"
    databaseUrl: postgres://woms:woms@postgres:5432/woms?sslmode=disable
    redisAddr: redis-master:6379
    kafkaPublishEnabled: "true"
    corsAllowedOrigin: "*"
    authMode: local
    authSessionStore: ""
    dependencyRetryTimeoutMs: "120000"
    dependencyRetryIntervalMs: "2000"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

worker:
  replicaCount: 1
  image:
    repository: woms-scheduler-worker
    tag: v0.1.76
  env:
    databaseUrl: postgres://woms:woms@postgres:5432/woms?sslmode=disable
    redisAddr: redis-master:6379
    minJobDurationMs: "0"
    maxRetries: "3"
    lockTtlMs: "15000"
    lockRenewIntervalMs: "5000"
    lockTimeoutMs: "10000"
    backfillIntervalMs: "5000"
    dependencyRetryTimeoutMs: "120000"
    dependencyRetryIntervalMs: "2000"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 1000m
      memory: 512Mi

web:
  replicaCount: 2
  pdb:
    minAvailable: 1
  service:
    type: ClusterIP
    annotations: {}
  image:
    repository: woms-web
    tag: v0.1.76
  metrics:
    enabled: true
    port: 9113
    image:
      repository: nginx/nginx-prometheus-exporter
      tag: "1.1.0"
      pullPolicy: IfNotPresent
    scrapeUri: http://127.0.0.1:8080/nginx_status
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: false
  className: nginx
  host: woms.local
  tls:
    enabled: false
    secretName: woms-tls
  auth:
    enabled: true

keda:
  enabled: true
  minReplicaCount: 2
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 120
  hpa:
    scaleUp:
      stabilizationWindowSeconds: 0
      percent: 100
      periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 120
      percent: 50
      periodSeconds: 60
  prometheus:
    serverAddress: "http://{{ include \"woms.fullname\" . }}-prometheus.{{ .Release.Namespace }}:9090"
    metricName: woms_web_nginx_requests_per_second_per_pod
    threshold: "20"
    query: |-
      sum(rate(nginx_http_requests_total{job="woms-web-nginx",namespace="{{ .Release.Namespace }}"}[1m])) / clamp_min(count(up{job="woms-web-nginx",namespace="{{ .Release.Namespace }}"}), 1)

postgresql:
  enabled: true
  fullnameOverride: postgres
  image:
    registry: docker.io
    repository: bitnamilegacy/postgresql
    tag: 16.4.0-debian-12-r14
  auth:
    username: woms
    password: woms
    database: woms
  primary:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

redis:
  enabled: true
  fullnameOverride: redis
  image:
    registry: docker.io
    repository: bitnamilegacy/redis
    tag: 7.2.5-debian-12-r4
  architecture: standalone
  auth:
    enabled: false
  master:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

kafka:
  enabled: true
  fullnameOverride: kafka
  image:
    registry: docker.io
    repository: bitnamilegacy/kafka
    tag: 3.7.1-debian-12-r4
  controller:
    replicaCount: 1
    extraConfigYaml:
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.min.isr: 1
      transaction.state.log.replication.factor: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1Gi
  broker:
    replicaCount: 0
  kraft:
    enabled: true
  listeners:
    client:
      protocol: PLAINTEXT
  provisioning:
    enabled: false

kafkaTopic:
  enabled: true
  image:
    repository: docker.io/bitnamilegacy/kafka
    tag: 3.7.1-debian-12-r4
    pullPolicy: IfNotPresent
  activeDeadlineSeconds: 420
  wait:
    maxAttempts: 60
    sleepSeconds: 5
  partitions: 0
  replicationFactor: 1

# ─── Monitoring Stack ───────────────────────────────────────────
monitoring:
  enabled: true

  # Prometheus scrape annotations (ServiceMonitor or pod annotations)
  prometheus:
    enabled: true
    image:
      repository: prom/prometheus
      tag: "v2.53.0"
    scrape:
      # API pods: scrape /metrics on port 8080
      api:
        path: /metrics
        port: "8080"
        interval: 15s
      web:
        path: /metrics
        port: "metrics"
        interval: 15s

  # Grafana deployment requires Grafana authentication before dashboard viewing.
  grafana:
    enabled: true
    externalPath: /grafana
    image:
      repository: grafana/grafana
      tag: "10.4.7"
    admin:
      existingSecret: ""
      user: admin
      userKey: admin-user
      password: ""
      passwordKey: admin-password
    env:
      anonymousEnabled: "false"
      anonymousOrgRole: Viewer
      allowEmbedding: "false"
      usersAllowSignUp: "false"
      cookieSameSite: lax
      serveFromSubPath: "true"
      rootUrl: ""
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
