ingress:
  enabled: true
  className: nginx
  host: woms.c1ydeh.net
  tls:
    enabled: true
    secretName: woms-c1ydeh-net-tls
  routeMode: directApi
  annotations:
    acme.cert-manager.io/http01-ingress-class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"

api:
  jwtSecretExistingSecret: woms-woms-api
  jwtSecretExistingSecretKey: JWT_SECRET
  env:
    authSessionStore: "redis"

keda:
  enabled: true

kafka:
  controller:
    replicaCount: 1
    extraConfigYaml:
      default.replication.factor: 1
      min.insync.replicas: 1
      offsets.topic.replication.factor: 1
      transaction.state.log.min.isr: 1
      transaction.state.log.replication.factor: 1
  broker:
    replicaCount: 0

kafkaTopic:
  enabled: true
  partitions: 0
  replicationFactor: 1

monitoring:
  enabled: true
  prometheus:
    enabled: true
  grafana:
    enabled: true
    admin:
      existingSecret: woms-woms-grafana-admin
