apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "woms.fullname" . }}-web
  labels:
    {{- include "woms.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ ternary .Values.keda.minReplicaCount .Values.web.replicaCount (and .Values.keda.enabled .Values.web.metrics.enabled) }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: web
    spec:
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: web
          image: "{{ include "woms.image" (dict "registry" .Values.imageRegistry "repository" .Values.web.image.repository "tag" .Values.web.image.tag) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: API_UPSTREAM
              value: {{ printf "%s-api:8080" (include "woms.fullname" .) | quote }}
            {{- if and .Values.monitoring.enabled .Values.monitoring.grafana.enabled }}
            - name: GRAFANA_UPSTREAM
              value: {{ printf "%s-grafana:3000" (include "woms.fullname" .) | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
        {{- if .Values.web.metrics.enabled }}
        - name: nginx-exporter
          image: "{{ .Values.web.metrics.image.repository }}:{{ .Values.web.metrics.image.tag }}"
          imagePullPolicy: {{ .Values.web.metrics.image.pullPolicy }}
          args:
            - -nginx.scrape-uri={{ .Values.web.metrics.scrapeUri }}
          ports:
            - name: metrics
              containerPort: {{ .Values.web.metrics.port }}
          resources:
            {{- toYaml .Values.web.metrics.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
        {{- end }}
      volumes:
        - name: nginx-conf
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
