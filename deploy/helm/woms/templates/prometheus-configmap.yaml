{{- if and .Values.monitoring.enabled .Values.monitoring.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "woms.fullname" . }}-prometheus
  labels:
    {{- include "woms.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.monitoring.prometheus.scrape.api.interval }}
      evaluation_interval: 15s

    scrape_configs:
      # ── Go API service metrics ──────────────────────────────────────
      - job_name: woms-api
        metrics_path: {{ .Values.monitoring.prometheus.scrape.api.path }}
        static_configs:
          - targets:
              - {{ include "woms.fullname" . }}-api:{{ .Values.monitoring.prometheus.scrape.api.port }}
            labels:
              service: woms-api
      {{- if and .Values.monitoring.gthulhu.enabled .Values.monitoring.prometheus.scrape.gthulhu }}
      # ── Gthulhu infrastructure metrics (Postgres/Redis/Kafka) ──────
      - job_name: gthulhu
        metrics_path: {{ .Values.monitoring.prometheus.scrape.gthulhu.path | default "/metrics" }}
        static_configs:
          - targets:
              - {{ include "woms.fullname" . }}-gthulhu:{{ .Values.monitoring.prometheus.scrape.gthulhu.port | default "9091" }}
            labels:
              service: gthulhu
      {{- end }}
{{- end }}
